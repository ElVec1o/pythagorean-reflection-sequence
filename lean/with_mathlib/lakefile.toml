# RotationRelations has NO source file in this directory, deliberately.  It lives in
# ../RotationRelations.lean, in the Mathlib-free package, and is compiled in place from
# there by the srcDir below.  Bridge, LinearPart and PlaneGroup import both it and
# Mathlib, so they can live in neither package alone.  srcDir is not a cross-package
# require: the file is import-free and is elaborated with THIS package's toolchain
# (v4.30.0), so the v4.13.0 pin of ../lean-toolchain is irrelevant here.  Do not copy the
# file into this directory; two divergent copies is exactly what this avoids.
[[lean_lib]]
name = "RotationRelations"
srcDir = ".."

